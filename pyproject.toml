[project]
name = "amazon-music-desktop"
version = "0.1.0"
description = "Desktop client for Amazon Music"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["S110", "BLE001", "TRY004", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
