name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-qt pyside6
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src --ignore-missing-imports
      - name: Unit & security tests
        run: python -m pytest tests/unit tests/security -q

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update
          # Qt6's xcb platform plugin (libxcb-cursor0 required since Qt 6.5)
          # and QtWebEngine both dlopen system libraries; without them the
          # QApplication aborts (SIGABRT) under xvfb.
          sudo apt-get install -y \
            xvfb \
            libgl1 libegl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 \
            libx11-xcb1 libice6 libsm6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-dri3-0 \
            libdbus-1-3 libnss3 libnspr4 \
            libasound2t64 libgbm1 libdrm2 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libudev1 \
            libwebp7 libwebpdemux2 libwebpmux3 libopus0 liblcms2-2 \
            libminizip1 libsnappy1v5 fonts-liberation
          python -m pip install --upgrade pip
          pip install pytest pytest-qt pyside6
      - name: Integration tests
        run: xvfb-run -a python -m pytest tests/integration -q
