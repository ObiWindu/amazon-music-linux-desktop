name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-qt pyside6
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src --ignore-missing-imports
      - name: Unit & security tests
        run: python -m pytest tests/unit tests/security -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install pytest pytest-qt pyside6
      - name: Integration tests
        run: xvfb-run -a python -m pytest tests/integration -q
